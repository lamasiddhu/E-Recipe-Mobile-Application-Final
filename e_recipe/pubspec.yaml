name: e_recipe
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.

  # State Management
  flutter_riverpod: ^3.0.3

  # Local Database (Offline Storage)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.4.1

  # Authentication

  # Media Handling
  fl_chart: ^1.1.1
  image_picker: ^1.0.7
  url_launcher: ^6.3.2
  google_sign_in: ^7.2.0
  permission_handler: ^12.0.3
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

  # Code Generation
  # NOTE: hive_generator removed — it pins analyzer <7.0.0 which conflicts with
  # riverpod 3 / flutter_test. Committed *.g.dart adapters are used as-is.
  # Add hive_ce_generator when migrating to hive_ce to regenerate adapters.

  # Testing

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Custom Fonts
  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 400
        - asset: assets/fonts/OpenSans-Italic.ttf
          weight: 500
        - asset: assets/fonts/OpenSans-Regular.ttf
          weight: 600
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 700

  # Assets
  assets:
    - assets/icons/
    - assets/svg/
    - assets/images/
